# Lets the agents work directly on GitHub: mention @claude in an issue or PR comment,
# e.g. "@claude act as backend-developer and implement this issue".
# Setup: in Claude Code, run /install-github-app (it creates the
# CLAUDE_CODE_OAUTH_TOKEN secret from your Claude subscription).
name: Claude agents

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    # Only respond to the repo owner, so strangers can't spend your quota
    if: |
      contains(github.event.comment.body || github.event.issue.body, '@claude') &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
